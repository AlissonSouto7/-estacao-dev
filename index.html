<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#282828">
<title>estacao-dev</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23282828'/%3E%3Ctext x='5' y='22' font-family='monospace' font-weight='700' font-size='16' fill='%23B8BB26'%3E%3E_%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#282828;--bg0:#1D2021;--bg1:#3C3836;--bg2:#504945;--bg3:#665C54;
  --fg:#EBDBB2;--gr:#928374;--yl:#FABD2F;--gn:#B8BB26;--aq:#8EC07C;--or:#FE8019;--rd:#FB4934;--bl:#83A598;--pu:#D3869B;
  --mono:"JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--mono);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:var(--bl)}
:focus-visible{outline:2px solid var(--yl);outline-offset:-2px}
::selection{background:var(--bg2)}
#app{height:100%}

.tm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);grid-template-rows:auto 1fr auto;height:100%}
.top{grid-column:1/-1;padding:9px 18px;border-bottom:1px solid var(--bg1);display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:13px}
.top .host{color:var(--gn);font-weight:700}
.top .host i{color:var(--bl);font-style:normal}
.top .adm{color:var(--rd)}
.top .adm b{color:var(--yl);font-weight:500}
.pane{overflow:auto;padding:14px 18px 30px;min-width:0}
.pane + .pane{border-left:1px solid var(--bg1)}
.pr{color:var(--gr);margin:12px 0 4px;overflow-wrap:anywhere}
.pr:first-child{margin-top:0}
.pr b{color:var(--gn);font-weight:500}
.pr i{color:var(--bl);font-style:normal}
.ln{display:flex;width:100%;white-space:pre;min-height:24px;align-items:center}
.ln:hover{background:var(--bg1)}
.ln .t{overflow:hidden;text-overflow:ellipsis}
.ln .g{color:var(--bg3)}
.ln .ct{color:var(--gr);margin-left:auto;padding-left:12px}
.ln.mod .t{color:var(--yl);font-weight:700}
.ln.tri .t{color:var(--or);font-weight:700}
.ln.done .t{color:var(--gr)}
.ln .ck{color:var(--bg3)}
.ln.done .ck{color:var(--gn)}
.ln.next .ck{color:var(--yl)}
.ln.next .t{color:var(--fg);text-decoration:underline;text-decoration-color:var(--yl);text-underline-offset:4px}
.ln.sel{background:var(--bg2)}
.bar{color:var(--gn)}
.bar s{color:var(--bg2);text-decoration:none}
.out{white-space:pre-wrap;overflow-wrap:anywhere}
.k{color:var(--rd)}.v{color:var(--aq)}.m{color:var(--gr)}.y{color:var(--yl)}.o{color:var(--or)}.gn{color:var(--gn)}.bl{color:var(--bl)}.pu{color:var(--pu)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.btn{border:1px solid var(--bg2);padding:6px 12px;color:var(--fg);text-decoration:none;display:inline-flex;gap:8px;align-items:center;min-height:36px}
.btn:hover{background:var(--bg1)}
.btn.pri{border-color:var(--yl);color:var(--yl)}
.btn.okk{border-color:var(--gn);color:var(--gn)}
.btn.dng{border-color:var(--rd);color:var(--rd)}
.btn[disabled]{opacity:.35;cursor:default}
.back{display:none;margin-bottom:10px}
.vid{position:relative;aspect-ratio:16/9;width:100%;background:#000;border:1px solid var(--bg1)}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid a{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--fg);text-decoration:none;gap:10px}

/* neofetch */
.neo{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;margin-top:6px}
.neo pre{margin:0;color:var(--gn);font:13px/1.25 var(--mono)}
.neo .info{white-space:pre-wrap;min-width:0;flex:1}
.neo .sw{display:flex;gap:0;margin-top:10px}
.neo .sw i{width:22px;height:14px;display:block}

/* conquistas */
.ach{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin-top:6px}
.ach .on{color:var(--yl)}
.ach .off{color:var(--bg3)}
.ach .d{color:var(--gr)}
.ach .d.on{color:var(--fg)}

/* nano */
.nano{border:1px solid var(--bg2);display:flex;flex-direction:column}
.nano .nh{background:var(--fg);color:var(--bg);padding:2px 10px;display:flex;justify-content:space-between;gap:10px}
.nano .nb{padding:12px;display:flex;flex-direction:column;gap:12px}
.nano label{color:var(--yl);display:block;margin-bottom:4px}
.nano input,.nano textarea{width:100%;background:var(--bg0);border:1px solid var(--bg1);color:var(--fg);font:inherit;padding:8px 10px;outline:none}
.nano input:focus,.nano textarea:focus{border-color:var(--yl)}
.nano textarea{min-height:120px;resize:vertical}
.nano .hint{color:var(--gr);font-size:12px;margin-top:4px}
.nano .nf{display:flex;gap:16px;flex-wrap:wrap;padding:6px 10px;border-top:1px solid var(--bg2)}
.nano .nf button{display:inline-flex;gap:6px;min-height:32px;align-items:center}
.nano .nf b{background:var(--fg);color:var(--bg);padding:0 4px;font-weight:500}

/* cli */
.cli{grid-column:1/-1;border-top:1px solid var(--bg1);padding:8px 18px 10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.hist{max-height:110px;overflow:auto;color:var(--gr);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.hist .er{color:var(--rd)}.hist .ok{color:var(--gn)}.hist .cm{color:var(--fg)}.hist .ac{color:var(--yl)}
.inp{display:flex;gap:8px;align-items:center}
.inp label{color:var(--gn);white-space:nowrap}
.inp input{flex:1;background:transparent;border:0;color:var(--fg);font:inherit;outline:none;min-width:0;caret-color:var(--yl)}
.chips{display:none;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{border:1px solid var(--bg2);padding:6px 10px;white-space:nowrap;color:var(--fg);flex:none}

.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-8px);background:var(--bg1);color:var(--gn);border:1px solid var(--gn);padding:7px 14px;font:13px var(--mono);z-index:50;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 24px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.ach{color:var(--yl);border-color:var(--yl)}
.load{padding:40px 18px;color:var(--gr)}

@media (max-width:899px){
  body{font-size:13px}
  .tm{grid-template-columns:1fr}
  .pane.side{display:none}
  .tm.reading .pane.tree{display:none}
  .tm.reading .pane.side{display:block;border-left:0}
  .ln{min-height:38px}
  .back{display:inline-flex}
  .pane{padding:12px 12px 24px}
  .top{padding:8px 12px;gap:10px}
  .cli{padding:6px 12px 10px}
  .chips{display:flex}
  .hist{max-height:72px}
  .neo pre{font-size:11px}
  .inp input{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="load">carregando estacao-dev...</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>window.__CONTEUDO__ = null;</script>
<script>
const XP_AULA = 10, XP_MOD = 50, XP_NIV = 100;
const TITULOS = ["estagiario","junior_i","junior_ii","junior_iii","pleno_i","pleno_ii","pleno_iii","senior_i","senior_ii","senior_iii","tech_lead","arquiteto","lenda_do_stackoverflow"];
const LS = { prog:"estacao:progresso", ui:"estacao:term", draft:"estacao:rascunho", hist:"estacao:cmdhist", nome:"estacao:nome" };

function lsGet(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function pad(n){ return String(n).padStart(2,"0"); }
function ytId(u){ try{ const x = new URL(u); if(x.hostname.includes("youtu.be")) return x.pathname.slice(1).split("/")[0]; if(x.searchParams.get("v")) return x.searchParams.get("v"); const m = x.pathname.match(/\/(embed|shorts|live)\/([^/?]+)/); return m ? m[2] : null; }catch(e){ return null; } }
function urlOk(u){ try{ const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; }catch(e){ return null; } }
function limpaUrl(u){ const id = ytId(u); return id ? "https://youtu.be/" + id : u; }
function dia(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function rid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function slugT(t){ return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,18) || "trilha"; }

const ui0 = lsGet(LS.ui, {});
const S = {
  admin: new URLSearchParams(location.search).has("admin"),
  rascunho: false,
  trilhas: [], idx: {},
  prog: lsGet(LS.prog, { concl:{} }),
  open: new Set(ui0.open || []),
  tid: ui0.tid || null,
  aula: null, view: "neofetch", nano: null,
  player: true,
  nome: lsGet(LS.nome, "dev"),
  hist: [], chist: lsGet(LS.hist, []), hpos: -1,
};

/* ---------- dados ---------- */
function ordenar(){ S.trilhas.sort((a,b) => (a.ordem||0)-(b.ordem||0)); }
function reindex(){
  S.idx = {};
  S.trilhas.forEach(t => (t.modulos||[]).forEach(m => (m.aulas||[]).forEach(a => { S.idx[a.id] = { t, m, a }; })));
  if(!S.trilhas.find(t => t.id === S.tid)) S.tid = S.trilhas[0] ? S.trilhas[0].id : null;
  if(S.aula && !S.idx[S.aula]){ S.aula = null; S.view = "neofetch"; }
}
async function carregar(){
  if(S.admin){ const d = lsGet(LS.draft, null); if(d){ S.trilhas = d.trilhas || []; S.rascunho = true; ordenar(); reindex(); return; } }
  if(window.__CONTEUDO__){ S.trilhas = JSON.parse(JSON.stringify(window.__CONTEUDO__.trilhas || [])); ordenar(); reindex(); return; }
  try{
    const r = await fetch("conteudo.json", { cache:"no-store" });
    if(!r.ok) throw new Error(r.status);
    S.trilhas = (await r.json()).trilhas || [];
  }catch(e){ S.trilhas = []; say("erro: não consegui ler conteudo.json", "er"); }
  ordenar(); reindex();
}
function salvarRascunho(){ ordenar(); reindex(); S.rascunho = true; lsSet(LS.draft, { trilhas: S.trilhas, em: new Date().toISOString() }); }
function salvarUI(){ lsSet(LS.ui, { open:[...S.open], tid:S.tid }); }

/* ---------- jogo ---------- */
const feita = id => !!S.prog.concl[id];
const aulasDe = t => (t.modulos||[]).flatMap(m => m.aulas||[]);
const modOk = m => (m.aulas||[]).length > 0 && m.aulas.every(a => feita(a.id));
const triOk = t => aulasDe(t).length > 0 && aulasDe(t).every(a => feita(a.id));
function xp(){ let x = 0; Object.keys(S.prog.concl).forEach(id => { if(S.idx[id]) x += XP_AULA; }); S.trilhas.forEach(t => (t.modulos||[]).forEach(m => { if(modOk(m)) x += XP_MOD; })); return x; }
const nivel = x => Math.floor(x/XP_NIV)+1;
const titulo = n => TITULOS[Math.min(n-1, TITULOS.length-1)];
const totalFeitas = () => Object.keys(S.prog.concl).filter(id => S.idx[id]).length;
function diasSet(){ return new Set(Object.values(S.prog.concl).map(v => dia(new Date(v)))); }
function streak(){ const ds = diasSet(), d = new Date(); let n = 0; if(!ds.has(dia(d))) d.setDate(d.getDate()-1); while(ds.has(dia(d))){ n++; d.setDate(d.getDate()-1); } return n; }
function melhorStreak(){ const ds = [...diasSet()].sort(); let best = 0, cur = 0, prev = null; ds.forEach(s => { const d = new Date(s+"T12:00:00"); if(prev && (d - prev) / 864e5 === 1) cur++; else cur = 1; best = Math.max(best, cur); prev = d; }); return best; }
const prox = t => t ? aulasDe(t).find(a => !feita(a.id)) || null : null;
const trilha = () => S.trilhas.find(t => t.id === S.tid) || S.trilhas[0] || null;
function contTr(t){ const as = aulasDe(t), f = as.filter(a => feita(a.id)).length; return { f, n:as.length, pc: as.length ? Math.round(f/as.length*100) : 0 }; }
function contMod(m){ const f = (m.aulas||[]).filter(a => feita(a.id)).length; return { f, n:(m.aulas||[]).length }; }
function vizinhos(id){ const r = S.idx[id], l = aulasDe(r.t), i = l.findIndex(a => a.id === id); return { ant:l[i-1], pro:l[i+1] }; }
function duracao(a){ const m = (a.notas||"").match(/Duração:\s*([\d:]+)/); return m ? m[1] : null; }
function notasLimpa(a){ return (a.notas||"").replace(/Duração:\s*[\d:]+\s*/,"").trim(); }
function posDe(id){ const r = S.idx[id]; const mi = r.t.modulos.indexOf(r.m), ai = r.m.aulas.indexOf(r.a); return { mi, ai }; }

const CONQ = [
  { id:"hello", nome:"hello_world", desc:"concluir a primeira aula", ok:() => totalFeitas() >= 1 },
  { id:"dez", nome:"loop_for", desc:"concluir 10 aulas", ok:() => totalFeitas() >= 10 },
  { id:"cinq", nome:"commit_streak", desc:"concluir 50 aulas", ok:() => totalFeitas() >= 50 },
  { id:"cem", nome:"centenario", desc:"concluir 100 aulas", ok:() => totalFeitas() >= 100 },
  { id:"mod", nome:"merge_aprovado", desc:"fechar um módulo inteiro", ok:() => S.trilhas.some(t => (t.modulos||[]).some(modOk)) },
  { id:"tri", nome:"release_1.0", desc:"zerar uma trilha", ok:() => S.trilhas.some(triOk) },
  { id:"s3", nome:"cron_job", desc:"3 dias seguidos estudando", ok:() => melhorStreak() >= 3 },
  { id:"s7", nome:"uptime_7d", desc:"7 dias seguidos estudando", ok:() => melhorStreak() >= 7 },
  { id:"s30", nome:"zero_downtime", desc:"30 dias seguidos estudando", ok:() => melhorStreak() >= 30 },
  { id:"mar", nome:"deploy_de_sexta", desc:"5 aulas no mesmo dia", ok:() => { const c = {}; return Object.values(S.prog.concl).some(v => { const d = dia(new Date(v)); c[d] = (c[d]||0)+1; return c[d] >= 5; }); } },
  { id:"cor", nome:"bug_das_3am", desc:"concluir uma aula entre 0h e 5h", ok:() => Object.values(S.prog.concl).some(v => new Date(v).getHours() < 5) },
  { id:"cedo", nome:"cafe_e_codigo", desc:"concluir uma aula antes das 7h", ok:() => Object.values(S.prog.concl).some(v => { const h = new Date(v).getHours(); return h >= 5 && h < 7; }) },
];
const conqOk = () => new Set(CONQ.filter(c => { try{ return c.ok(); }catch(e){ return false; } }).map(c => c.id));

/* ---------- saída ---------- */
function say(t, c=""){ S.hist.push({ t, c }); S.hist = S.hist.slice(-60); }
let tt;
function toast(t, ach){ const el = document.getElementById("toast"); el.textContent = t; el.className = "toast on" + (ach ? " ach" : ""); clearTimeout(tt); tt = setTimeout(() => el.className = "toast", ach ? 3600 : 2400); }
function barra(p, w){ const f = Math.round(Math.max(0,Math.min(100,p))/100*w); return `<span class="bar">[${"#".repeat(f)}<s>${"-".repeat(w-f)}</s>]</span>`; }
function prompt(path, c){ return `<div class="pr"><b>${esc(S.nome)}@estacao</b>:<i>${esc(path)}</i>$ ${esc(c)}</div>`; }
const tpath = t => "~/" + (t ? slugT(t.titulo) : "");

/* ---------- ações ---------- */
function abrirAula(id){
  const r = S.idx[id]; if(!r) return;
  S.aula = id; S.view = "aula"; S.nano = null; S.tid = r.t.id; S.open.add(r.m.id); salvarUI(); render();
  const p = document.querySelector(".pane.side"); if(p) p.scrollTop = 0;
}
function mostrar(v){ S.view = v; S.aula = null; S.nano = null; render(); }
function toggle(id){ S.open.has(id) ? S.open.delete(id) : S.open.add(id); salvarUI(); render(); }
function concluir(id){
  const r = S.idx[id]; if(!r) return;
  const x0 = xp(), n0 = nivel(x0), c0 = conqOk();
  if(feita(id)){ delete S.prog.concl[id]; lsSet(LS.prog, S.prog); say("git revert: aula desmarcada", "m"); render(); return; }
  S.prog.concl[id] = new Date().toISOString(); lsSet(LS.prog, S.prog);
  const g = xp() - x0, n1 = nivel(xp()), c1 = conqOk();
  const novas = CONQ.filter(c => c1.has(c.id) && !c0.has(c.id));
  say(`[ok] ${r.a.titulo} (+${g} xp)`, "ok");
  if(modOk(r.m)) say(`módulo completo: ${r.m.titulo}`, "ok");
  if(n1 > n0) say(`level up! nível ${n1}: ${titulo(n1)}`, "ac");
  novas.forEach(c => say(`conquista desbloqueada: ${c.nome}`, "ac"));
  render();
  if(novas.length) toast(`conquista: ${novas[0].nome}`, true);
  else if(n1 > n0) toast(`level up! ${titulo(n1)}`, true);
  else toast(`+${g} xp`);
}

/* ---------- admin ---------- */
function exportar(){
  const blob = new Blob([JSON.stringify({ versao:1, gerado:new Date().toISOString(), trilhas:S.trilhas }, null, 2)], { type:"application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "conteudo.json";
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  say("conteudo.json baixado. suba no GitHub pra publicar.", "ok");
}
function parseMat(txt){ return txt.split("\n").map(l => l.trim()).filter(Boolean).map(l => { const p = l.split("|").map(s => s.trim()); return p.length > 1 ? { titulo:p.slice(0,-1).join(" | "), url:p[p.length-1] } : { titulo:"", url:p[0] }; }).filter(m => urlOk(m.url)); }
function matTxt(ms){ return (ms||[]).map(m => (m.titulo ? m.titulo + " | " : "") + m.url).join("\n"); }
function importar(t, txt){
  let atual = t.modulos[t.modulos.length-1], n = 0;
  txt.split("\n").map(l => l.trim()).filter(Boolean).forEach(l => {
    if(l.startsWith("#")){ atual = { id:rid(), titulo:l.replace(/^#+/,"").trim() || "modulo", aulas:[] }; t.modulos.push(atual); return; }
    if(!atual){ atual = { id:rid(), titulo:"modulo 1", aulas:[] }; t.modulos.push(atual); }
    const p = l.split("|").map(s => s.trim()).filter(s => s && s !== "-");
    const ui = p.findIndex(s => urlOk(s));
    const url = ui >= 0 ? limpaUrl(p[ui]) : "";
    const dur = p.find(s => /^\d{1,2}(:\d{2}){1,2}$/.test(s));
    const tit = p.filter((s,i) => i !== ui && s !== dur && s !== "SEM VIDEO").join(" | ") || ("aula " + (atual.aulas.length + 1));
    atual.aulas.push({ id:rid(), titulo:tit, url, materiais:[], notas: dur ? "Duração: " + dur : "" }); n++;
  });
  return n;
}
function salvarNano(){
  const f = document.getElementById("nanoform"); if(!f || !S.nano) return;
  const v = Object.fromEntries(new FormData(f).entries());
  const t = trilha(), nz = S.nano;
  if(nz.tipo === "aula"){
    const r = S.idx[nz.id]; if(!r) return;
    r.a.titulo = (v.titulo||"").trim() || r.a.titulo; r.a.url = v.url ? limpaUrl(v.url.trim()) : "";
    r.a.materiais = parseMat(v.materiais||"");
    const dur = (v.duracao||"").trim(); r.a.notas = (dur ? "Duração: " + dur + "\n" : "") + (v.notas||"").trim();
    say("aula salva: " + r.a.titulo, "ok");
  } else if(nz.tipo === "mod"){
    const m = t.modulos.find(x => x.id === nz.id); if(m){ m.titulo = (v.titulo||"").trim() || m.titulo; say("módulo salvo: " + m.titulo, "ok"); }
  } else if(nz.tipo === "trilha"){
    t.titulo = (v.titulo||"").trim() || t.titulo; t.descricao = (v.descricao||"").trim(); say("trilha salva: " + t.titulo, "ok");
  } else if(nz.tipo === "import"){
    const n = importar(t, v.lista||""); say(`${n} aulas importadas em ${t.titulo}`, "ok");
  }
  salvarRascunho(); S.nano = null; S.view = nz.tipo === "aula" ? "aula" : "neofetch"; if(nz.tipo !== "aula") S.aula = null;
  render();
}

const CMDS = ["help","neofetch","next","ok","cd","ls","open","tree","fold","player","achievements","status","nome","clear"];
const ADM = ["add","edit","rm","mv","import","export","discard"];
function alvoMA(arg, t){ const m = arg.match(/^(\d+)\/(\d+)$/); if(!m) return null; const mod = t.modulos[+m[1]-1]; const a = mod && mod.aulas[+m[2]-1]; return a ? { mod, a } : null; }
function cmd(raw){
  const c = raw.trim(); if(!c) return;

  say("$ " + c, "cm");

  const t = trilha();

      if(S.admin) say("admin:\n  add trilha NOME · add mod NOME · add aula M TÍTULO | URL\n  edit trilha · edit mod M · edit aula M/A\n  rm mod M · rm aula M/A · rm trilha\n  mv mod M up|down · mv aula M/A up|down · mv trilha up|down\n  import          cola uma lista de aulas na trilha atual\n  export          baixa o conteudo.json para subir no GitHub\n  discard         descarta o rascunho", "bl");
      break;
    case "neofetch": case "status": mostrar("neofetch"); return;
    case "achievements": case "conquistas": mostrar("conq"); return;
    case "ls": S.trilhas.forEach((tr,i) => say(`${pad(i+1)}  ${String(contTr(tr).pc).padStart(3)}%  ${tr.titulo}`)); break;
    case "next": { const p = prox(t); if(p){ abrirAula(p.id); say("abrindo: " + p.titulo, "ok"); return; } say("nada pendente nesta trilha", "er"); break; }
    case "ok": case "done": if(S.aula){ concluir(S.aula); return; } say("nenhuma aula aberta. use next", "er"); break;
    case "cd": {
      if(arg === ".." || arg === "~" || !arg){ mostrar("neofetch"); return; }
      const i = parseInt(arg,10)-1;
      if(S.trilhas[i]){ S.tid = S.trilhas[i].id; S.aula = null; S.view = "neofetch"; const p = prox(S.trilhas[i]); if(p) S.open.add(S.idx[p.id].m.id); salvarUI(); say("trilha: " + S.trilhas[i].titulo, "ok"); }
      else say("trilha não encontrada. use ls", "er");
      break;
    }
    case "open": { const r = t && alvoMA(arg, t); if(r){ abrirAula(r.a.id); say("abrindo: " + r.a.titulo, "ok"); return; } say("uso: open M/A  (ex: open 2/5)", "er"); break; }
    case "tree": if(t) t.modulos.forEach(m => S.open.add(m.id)); salvarUI(); break;
    case "fold": if(t) t.modulos.forEach(m => S.open.delete(m.id)); salvarUI(); break;
    case "player": S.player = !S.player; say("player: " + (S.player ? "on" : "off")); break;
    case "nome": { const n = arg.toLowerCase().replace(/[^a-z0-9_-]/g,"").slice(0,16); if(n){ S.nome = n; lsSet(LS.nome, n); say("prompt agora é " + n + "@estacao", "ok"); } else say("uso: nome seu_nome", "er"); break; }
    case "clear": S.hist = []; break;
    case "sudo": say("boa tentativa.", "er"); break;

    default:
      if(S.admin && ADM.includes(k)){ admin(k, parts.slice(1), t); return; }

function admin(k, p, t){
  const sub = (p[0]||"").toLowerCase(), resto = p.slice(1).join(" ");
  const done = msg => { if(msg) say(msg, "ok"); salvarRascunho(); render(); };
  if(k === "export"){ exportar(); render(); return; }
  if(k === "discard"){ if(confirm("Descartar o rascunho e voltar ao conteúdo publicado?")){ localStorage.removeItem(LS.draft); S.rascunho = false; S.aula = null; S.view = "neofetch"; carregar().then(() => { say("rascunho descartado", "ok"); render(); }); } return; }
  if(k === "import"){ if(!t){ say("crie uma trilha antes: add trilha NOME", "er"); render(); return; } abrirNano("import"); return; }
  if(k === "add"){
    if(sub === "trilha"){ if(!resto){ say("uso: add trilha NOME", "er"); render(); return; } const nt = { id:rid(), titulo:resto, sigla:resto.slice(0,2).toUpperCase(), descricao:"", cor:"#FABD2F", ordem:(S.trilhas.reduce((m,x) => Math.max(m, x.ordem||0), 0) + 1), modulos:[] }; S.trilhas.push(nt); S.tid = nt.id; salvarUI(); return done("trilha criada: " + resto); }
    if(!t){ say("crie uma trilha antes: add trilha NOME", "er"); render(); return; }
    if(sub === "mod"){ if(!resto){ say("uso: add mod NOME", "er"); render(); return; } const nm = { id:rid(), titulo:resto, aulas:[] }; t.modulos.push(nm); S.open.add(nm.id); return done("módulo criado: " + resto); }
    if(sub === "aula"){ const mi = parseInt(p[1],10)-1, m = t.modulos[mi]; const txt = p.slice(2).join(" "); if(!m || !txt){ say("uso: add aula M TÍTULO | URL", "er"); render(); return; } const parts = txt.split("|").map(s => s.trim()); const url = parts.length > 1 ? limpaUrl(parts.pop()) : ""; m.aulas.push({ id:rid(), titulo:parts.join(" | "), url, materiais:[], notas:"" }); S.open.add(m.id); return done("aula criada em " + m.titulo); }
  }
  if(!t){ say("nenhuma trilha", "er"); render(); return; }
  if(k === "edit"){
    if(sub === "trilha"){ abrirNano("trilha"); return; }
    if(sub === "mod"){ const m = t.modulos[parseInt(p[1],10)-1]; if(m){ abrirNano("mod", m.id); return; } }
    if(sub === "aula"){ const r = alvoMA(p[1]||"", t); if(r){ S.aula = r.a.id; abrirNano("aula", r.a.id); return; } }
    if(!sub && S.aula){ abrirNano("aula", S.aula); return; }
    say("uso: edit trilha · edit mod M · edit aula M/A", "er"); render(); return;
  }
  if(k === "rm"){
    if(sub === "trilha"){ if(confirm(`Excluir a trilha "${t.titulo}" inteira?`)){ S.trilhas = S.trilhas.filter(x => x !== t); S.tid = null; S.aula = null; S.view = "neofetch"; return done("trilha removida"); } render(); return; }
    if(sub === "mod"){ const mi = parseInt(p[1],10)-1, m = t.modulos[mi]; if(m && confirm(`Excluir o módulo "${m.titulo}" e suas ${m.aulas.length} aulas?`)){ t.modulos.splice(mi,1); return done("módulo removido"); } if(!m) say("uso: rm mod M", "er"); render(); return; }
    if(sub === "aula"){ const r = alvoMA(p[1]||"", t); if(r && confirm(`Excluir a aula "${r.a.titulo}"?`)){ r.mod.aulas.splice(r.mod.aulas.indexOf(r.a),1); if(S.aula === r.a.id){ S.aula = null; S.view = "neofetch"; } return done("aula removida"); } if(!r) say("uso: rm aula M/A", "er"); render(); return; }
  }
  if(k === "mv"){
    const dirOf = s => s === "up" ? -1 : s === "down" ? 1 : 0;
    const swap = (arr, i, d) => { const j = i + d; if(!d || j < 0 || j >= arr.length) return false; [arr[i], arr[j]] = [arr[j], arr[i]]; return true; };
    if(sub === "trilha"){ const d = dirOf(p[1]); const i = S.trilhas.indexOf(t); if(swap(S.trilhas, i, d)){ S.trilhas.forEach((x,n) => x.ordem = n+1); return done("ordem atualizada"); } }
    if(sub === "mod"){ const i = parseInt(p[1],10)-1; if(swap(t.modulos, i, dirOf(p[2]))) return done("módulo movido"); }
    if(sub === "aula"){ const r = alvoMA(p[1]||"", t); if(r && swap(r.mod.aulas, r.mod.aulas.indexOf(r.a), dirOf(p[2]))) return done("aula movida"); }
    say("uso: mv mod M up|down · mv aula M/A up|down · mv trilha up|down", "er"); render(); return;
  }
  say("uso inválido. digite help", "er"); render();
}
function completar(inp){
  const v = inp.value, parts = v.split(/\s+/);
  const pool = CMDS.concat(S.admin ? ADM : []);
  if(parts.length === 1){
    const ms = pool.filter(c => c.startsWith(parts[0].toLowerCase()));
    if(ms.length === 1) inp.value = ms[0] + " ";
    else if(ms.length > 1){ say(ms.join("  "), "m"); render(); focoCli(); document.getElementById("cmd").value = v; }
  } else if(["add","edit","rm","mv"].includes(parts[0]) && parts.length === 2){
    const ms = ["trilha","mod","aula"].filter(s => s.startsWith(parts[1]));
    if(ms.length === 1) inp.value = parts[0] + " " + ms[0] + " ";
  }
}

  if(e.ctrlKey && e.key.toLowerCase() === "l"){ e.preventDefault(); S.hist = []; render(); focoCli(); return; }
  if(inCli){
    if(e.key === "Tab"){ e.preventDefault(); completar(e.target); return; }
    if(e.key === "ArrowUp"){ e.preventDefault(); if(!S.chist.length) return; S.hpos = S.hpos < 0 ? S.chist.length - 1 : Math.max(0, S.hpos - 1); e.target.value = S.chist[S.hpos]; return; }
    if(e.key === "ArrowDown"){ e.preventDefault(); if(S.hpos < 0) return; S.hpos++; if(S.hpos >= S.chist.length){ S.hpos = -1; e.target.value = ""; } else e.target.value = S.chist[S.hpos]; return; }
    return;
  }
  if(e.target.matches("input,textarea")) return;
  if(e.key === "Escape" && S.view !== "neofetch"){ mostrar("neofetch"); return; }
  if(S.aula && S.view === "aula" && (e.key === "ArrowRight" || e.key === "ArrowLeft")){ const v = vizinhos(S.aula); const nx = e.key === "ArrowRight" ? v.pro : v.ant; if(nx) abrirAula(nx.id); return; }
  if(e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey){ const i = document.getElementById("cmd"); if(i) i.focus(); }
});

(async () => {
  await carregar();
  const t = trilha();
  if(t && !t.modulos.some(m => S.open.has(m.id))){ const p = prox(t); if(p) S.open.add(S.idx[p.id].m.id); else if(t.modulos[0]) S.open.add(t.modulos[0].id); }
  say("estacao-dev v1.0 · digite help · Tab completa · ↑ histórico", "m");
  if(S.admin) say(S.rascunho ? "[admin] rascunho carregado do navegador" : "[admin] modo edição ativo", "bl");
  if(S.nome === "dev") say("dica: nome seu_nome personaliza o prompt", "m");
  render(); focoCli();
})();
</script>
